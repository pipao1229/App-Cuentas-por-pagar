name: Keep Supabase Alive

on:
  schedule:
    # Todos los días a las 8:00 AM UTC (2:00 AM hora Costa Rica)
    - cron: '0 8 * * *'
  workflow_dispatch: # permite correrlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (consulta real a la base de datos)
        run: |
          curl -f -sS https://app-cuentas-por-pagar-api.onrender.com/health